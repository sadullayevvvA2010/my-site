<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | MY SITE</title>
  <meta name="description" content="Projects archive for MY SITE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">MY<span>SITE</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Bosh sahifa</a>
        <a href="about.html" class="nav-link" data-i18n="nav_about">Men haqimda</a>
        <a href="projects.html" class="nav-link" data-i18n="nav_projects">Loyihalar</a>
        <a href="skills.html" class="nav-link" data-i18n="nav_skills">Ko'nikmalar</a>
        <a href="contact.html" class="nav-link" data-i18n="nav_contact">Aloqa</a>
      </nav>
      <div class="nav-actions">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="uz">UZ</button>
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Theme"><span id="themeIcon">🌙</span></button>
        <button class="icon-btn" id="authBtn" data-i18n="nav_login">Kirish</button>
        <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="section page-intro">
      <div class="container small-container">
        <p class="eyebrow" data-i18n="projects_title">Loyihalar</p>
        <h1 class="page-title" data-i18n="projects_title">Mening loyihalarim</h1>
        <p class="section-sub" data-i18n="projects_sub">Men yaratgan ishlar</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="projectAdmin" class="admin-panel hidden">
          <h3 data-i18n="projects_admin">Loyiha qo'shish</h3>
          <form id="projectForm" class="admin-form">
            <input type="text" id="pName" data-i18n-placeholder="project_name" placeholder="Loyiha nomi" required />
            <input type="text" id="pDesc" data-i18n-placeholder="project_desc" placeholder="Qisqacha tavsif" required />
            <input type="text" id="pTech" data-i18n-placeholder="project_tech" placeholder="Texnologiyalar (vergul bilan)" required />
            <input type="url" id="pImage" data-i18n-placeholder="project_image" placeholder="Rasm URL" />
            <input type="url" id="pDemo" data-i18n-placeholder="project_demo_url" placeholder="Live Demo URL" />
            <input type="url" id="pGithub" data-i18n-placeholder="project_github_url" placeholder="GitHub URL" />
            <button type="submit" class="btn btn-primary" data-i18n="projects_add">Qo'shish</button>
          </form>
        </div>

        <div id="projectsGrid" class="projects-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> MY SITE. <span data-i18n="footer_rights">Barcha huquqlar himoyalangan.</span></p>
    </div>
  </footer>
  <div class="toast" id="toast"></div>
  <script src="js/site.js"></script>
</body>
</html>
